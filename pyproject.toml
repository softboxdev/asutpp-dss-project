[tool.poetry]
name = "asutp-dss-local"
version = "0.1.0"
description = "Локальная СППР для проектирования архитектуры ПО АСУ ТП"
authors = ["Almagul Kondybayeva <soft.box.development@gmail.com>"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

# === DeepSeek через Ollama (без vLLM!) ===
openai = "^1.50.0"
huggingface-hub = "^0.26.0"

# === Ядро ML ===
torch = {version = "^2.5.0", source = "pytorch"}
torch-geometric = "^2.6.0"
transformers = "^4.46.0"
sentence-transformers = "^3.3.0"
accelerate = "^1.1.0"
bitsandbytes = "^0.44.0"

# === Классический ML ===
xgboost = "^2.1.0"
lightgbm = "^4.5.0"
scikit-learn = "^1.5.0"

# === Оптимизация ===
pymoo = "^0.6.1"
simpy = "^4.1.1"

# === XAI ===
shap = "^0.46.0"

# === NLP ===
spacy = "^3.8.0"
nltk = "^3.9.0"

# === Парсинг документов ===
pypdf2 = "^3.0.1"
python-docx = "^1.1.0"

# === API + UI ===
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
streamlit = "^1.40.0"
typer = "^0.13.0"
rich = "^13.9.0"

# === Хранилище ===
sqlalchemy = "^2.0.36"
networkx = "^3.4.0"

# === Утилиты ===
pyyaml = "^6.0.2"
python-dotenv = "^1.0.1"
loguru = "^0.7.2"
tqdm = "^4.67.0"
joblib = "^1.4.2"
numpy = ">=2.0.0,<2.1.0"
pandas = "^2.2.3"
scipy = "^1.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.24.0"
jupyter = "^1.1.0"
ipykernel = "^6.29.0"
ruff = "^0.8.0"
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.13.0"
pre-commit = "^4.0.0"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=html --cov-report=term"
asyncio_mode = "auto"
